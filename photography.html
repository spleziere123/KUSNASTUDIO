<style>
/* ===== Photography Grid 5x4 ===== */
.grid-5x4 {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(4, 1fr);
  padding: 0;
  height: calc(100vh - 100px);
  margin: 0;

}

.grid-item {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: filter 0.3s ease;
}

.grid-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}

.grid-item:hover img {
  transform: scale(1.05);
}

.scale-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0);
  color: #f3f57f;
  font-size: 18px;
  font-weight: bold;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
}

.grid-item:hover .scale-label {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.05);
}

.grid-5x4:hover .grid-item {
  filter: grayscale(60%);
}

.grid-5x4 .grid-item:hover {
  filter: none;
}

@media(max-width:1200px){
  .grid-5x4 {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: auto;
  }
}

@media(max-width:768px){
  .grid-5x4 {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }
}
</style>
</head>
